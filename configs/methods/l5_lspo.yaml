# L5 BASELINE: LSPO — transient LoRA fitted on GOLD (x -> y*), no bridge.
#
# The operator control for the main table. Same loop, same loss, same filters
# as configs/methods/l5_staged_dpo_s3.yaml; the ONE thing that changes is what
# the transient adapter is fitted on:
#
#   main arm (staged_bridge_sft)  self-generated bridge trajectories z+ (the
#                                 policy's own writing, produced from a
#                                 privileged y*-showing prompt), staged, stage-2 DPO
#   THIS FILE (lora_sft)          the gold solution y* itself
#
# It answers the skeptic's first question: does the rescue trajectory have to be
# ON-POLICY, or is any correct solution enough? Note that y* still never reaches
# a prompt or any training text — it enters through adapter WEIGHTS only, and the
# rows that get trained on are the policy's own samples from that adapter. The
# off-policy-TEXT version of this question is a separate arm (plain gold SFT),
# not this one.
#
#   bash scripts/run.sh -c configs/methods/l5_lspo.yaml -b
#
# FIT-BUDGET MATCHING (the only non-obvious choice here). The main arm spends
# 2 stage-1 steps + 2 stage-2 steps = 4 gradient steps per adapter and samples
# final_rollout_n: 16 at the end. This arm is single-stage, so fit.steps is set
# to 4 and improve.n to 16 — equal total fit budget, equal candidate sampling.
# The per-stage-matched variant (2 steps) is one override:
#   --override improve.lora_sft.fit.steps=2
#
# Sharding: chunk_size is the lora_sft equivalent of the staged arm's
# stage1/stage2_chunk_size, set to the same 100 questions per adapter
# (~4,900 cliffs -> ~49 adapters; keep engine.max_loras above that).
#
# Paired loss control (LSPO under today's loss instead of the objective — use
# this if you want the "named baseline" reading rather than the operator ablation):
#   --override train.sft.cliff.enabled=false
#
# Held-out cliff set (build once, reuse for EVERY arm and iteration):
#   --override data.exclude_train_qids=<run>/iter_0/cliff_split.json

run:
  name: l5_lspo
  output_root: runs
  seed: 17
  wandb:
    project: ei_reasoning
    # null -> whichever account is logged in on THIS machine, so a run logs to
    # its own operator's wandb and nothing can fail on a team membership the
    # machine does not have. Runs therefore live in two places when two people
    # run arms; that is fine, because NOTHING in the analysis reads wandb —
    # every paper number comes from metrics.jsonl / verdicts.jsonl, which
    # scripts/collect_run_artifacts.sh packs. Set a shared team entity here
    # only if both accounts are members (wandb.init raises otherwise and
    # loop.py does not catch it -> the run dies at startup).
    entity: null
    mode: online

model:
  base: Qwen/Qwen3-4B-Instruct-2507
  dtype: bfloat16
  # A NO-OP for this base and pinned deliberately: Qwen3-4B-Instruct-2507 is a
  # non-thinking model whose chat template has no `enable_thinking` variable and
  # no <think> tag, so token ids are byte-identical with or without it (checked).
  # It is load-bearing the moment model.base becomes a HYBRID model (Qwen3-4B,
  # -8B, -14B), where the same flag flips the template into thinking mode — and
  # configs/bench_eval.yaml already sets it, so pinning it here keeps the
  # in-loop benchmark canaries and the standalone headline eval on the same
  # prompt for every base we might swap in.
  chat_template_kwargs: {enable_thinking: false}

engine:
  gpus: null
  tensor_parallel: 1
  gpu_memory_utilization: 0.95   # srun owns these GPUs outright; the
                              # score path still drops to 0.80 below
  max_model_len: 20480        # >= train.max_seq_len
  enable_lora: true           # q_phi is served through per-request adapters
  max_loras: 10               # NOT the shard count. The pool worker groups
                              # requests by adapter and issues one generate call
                              # per group (engine.py), so exactly ONE adapter is
                              # live at a time and vLLM never revisits an evicted
                              # one; shards are single-adapter by construction.
                              # 80 slots reserved ~4.9 GB of KV cache (63 MB per
                              # rank-16 adapter) for nothing, and KV is what caps
                              # concurrency in the 16k tail. 10 is headroom.
  max_lora_rank: 16
  max_logprobs: 20
  score_gpu_memory_utilization: 0.80
  score_max_num_batched_tokens: 4096

data:
  # IDENTICAL to the main arm. y* rides in meta.gold_solution of the mix, which
  # is what this operator fits on.
  adapter: local_jsonl
  adapter_args:
    path: data/mixes/openr1_mix6k_qwen3-4b-2507.jsonl
  question_suffix: "\n\nPlease reason step by step, and put your final answer within \\boxed{}."
  eval_holdout: 0
  holdout_path: data/mixes/openr1_mix8k_qwen3-4b-2507_cliff_holdout.jsonl
  accumulate: true

rollout:
  n: 8
  temperature: 1.0
  top_p: 0.95
  max_tokens: 16384

partition:
  verifier: math
  solved_keep_max: 4          # MATCHED to the main arm. Do not tune per arm.
  solved_selection: shortest
  cliff_max_correct: 0

anchor:
  policy: none                # no anchor, same as the main arm. With lora_sft an
                              # anchor could not enter the fit anyway (y* is not a
                              # continuation of a failed prefix)
  base_selection: first_failed   # NOT min_mean_nll: with policy=none the pick
                              # only stamps base_sample_idx onto ids, but
                              # min_mean_nll pays a full vLLM score pass over
                              # every failed rollout for it — MEASURED 763s per
                              # iteration on 500 questions, ~3.4h at 8k.

improve:
  operator: lora_sft          # <-- THE treatment variable vs the main arm
  n: 16                       # candidates per cliff from q_phi; matches the main
                              # arm's staged.final_rollout_n
  temperature: 1.2
  top_p: 0.98
  max_tokens: 16384
  lora_sft:
    adapter_scope: pooled
    chunk_size: 100           # one adapter per 100 cliffs. QUESTIONS per adapter
                              # is the matching unit, not pairs: the toy LSPO run
                              # (data/configs/LSPO.yaml) validated 107 questions
                              # on one pooled rank-16 adapter, and the staged arm
                              # shards at 100 too. The 6k mix yields ~3,650 cliffs
                              # at rollout.n=8 (measured from meta.passrate_c:
                              # sum (1-c/16)^8), so this is ~37 adapters, well
                              # past engine.max_loras — which is fine, see there.
                              # 0 would put all ~3,650 on ONE
                              # adapter and dilute the per-question signal with
                              # nothing erroring.
                              #
                              # ASYMMETRY TO REPORT, not to "fix" with chunk_size:
                              # a gold pair is 415 response tokens on average
                              # (measured, n=400 of this mix), so an adapter here
                              # sees ~42k tokens, against ~1.4M for a staged shard
                              # (~3 bridges/question x ~4.7k tokens, the toy's
                              # 313 pairs = 1.47M). Gold y* is a terse reference
                              # solution; a bridge is a full CoT. That IS the
                              # difference under test. The lever for gradient
                              # volume is fit.steps below, never chunk_size --
                              # raising chunk_size would put MORE questions on the
                              # same adapter, which is the opposite of helping.
    refit_budget: 0
    fit:
      r: 16
      lora_alpha: 32
      lr: 1.0e-4
      steps: 4                # = the main arm's 2 (stage 1) + 2 (stage 2). Also
                              # MORE than the toy LSPO run's 3, so this arm cannot
                              # be read as an under-trained baseline. A fit here is
                              # ~42k tokens (~15 s + ~50 s adapter load) against
                              # ~9 min for a staged shard, so extra steps are
                              # nearly free -- probe 3/4/8 on the 1k mix before the
                              # full run rather than assuming 4 is enough:
                              #   --override data.adapter_args.path=data/mixes/openr1_mix500_qwen3-4b-2507.jsonl
                              #   --override improve.lora_sft.fit.steps=8
      max_pair_tokens: 16384
      dropout: 0.0
      micro_batch_size: 1
      max_grad_norm: 1.0
      bf16: true
      target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
      num_processes: null
      adaptive:
        enabled: false
    project_back:
      enabled: false          # vanilla: no alpha scaling, same as the main arm
  rl:
    enabled: false
  rounds: 1

filter:                       # IDENTICAL to the main arm
  gates: [correctness, no_external_context, length, dedup]
  max_total_tokens: 18432
  max_per_question: 2         # the cliff-row dose. Must match every arm that
                              # produces cliff rows, or "source" confounds with
                              # "quantity"
  selection:
    method: shortest
    always_score: true        # the cliff guard joins this pass's s_mean
    lambda_tail: 1.0
    gamma_dtail: 0.0
    tail_fraction: 0.1
    scope: continuation

train:                        # IDENTICAL to the main arm, objective included, so
                              # the only difference in the whole run is the operator
  objective: sft
  init_from: base
  backend: zero2
  max_seq_len: 18432
  sft:
    lr: 1.0e-5
    epochs: 2
    global_batch_size: 32
    micro_batch_size: 1
    region_weights:
      prompt: 0.0
      anchor: 1.0
      continuation: 1.0
      solution: 1.0
    cliff:
      enabled: true
      rho: 0.3
      per_question_norm: true
      m_per_batch: auto       # cliff rows per 32-example global batch window.
                              # NOT 1: an epoch is sized by the SOLVED pool
                              # (n_win = n_solved // fill), so a fixed value
                              # decides coverage by accident. L3's ratio (118
                              # improved rows / 173 windows) over-sampled at 1,
                              # but this mix over-samples cliffs ~12x and at 1 a
                              # 6k run would train on only ~24% of its rescue
                              # trajectories per epoch (measured 4% on a
                              # 300-question smoke). auto solves for the
                              # smallest m_C that shows every improved row once
                              # — and returns 1 at L3-like ratios, so the
                              # validated setting is untouched there.
      negative:
        mode: "off"
      guard:
        enabled: true

loop:
  iterations: 3

eval:
  # TRACKING ONLY — the headline is NOT measured here. Per docs/L5_protocol_20260829.md
  # the paper's cliff numbers come from a post-hoc `scripts/cliff_reroll.py
  # --qids-file holdout --n 32` on the FINAL checkpoint (plus one base floor
  # shared by every arm), which is the L3 measurement path and runs at
  # rollout.max_tokens. This in-loop pass exists to draw the per-iteration
  # curve, so it is deliberately cheap: greedy off, k=4.
  greedy_pass1: false
  passk: {k: 4, temperature: 0.7, top_p: 0.95}
  max_tokens: 16384         # match rollout: 14.6% of correct samples
                            # exceed 8192 (measured), and censoring them
                            # penalises whichever arm reasons longest
  benchmark_verifier: math_strict
  # Regression canaries on the trained checkpoint — NOT the paper's benchmark
  # numbers (those come from scripts/eval_bench.sh at n=32 on the final ckpt,
  # docs/L5_protocol_20260829.md §3). Their job is only to show that learning
  # cliffs hard does not break general math.
  #
  # n differs by design: aime24 has 30 questions to math500_hard's 134, so the
  # smaller set buys its precision with more samples. Both run at 16384 —
  # math500_hard used to be capped at 8192 and MEASURED 6.5% -> 8.8% truncation
  # across iterations, which censors exactly the arms that reason longest and
  # drifts as the policy does.
  benchmark_every: 1          # EVERY iteration — the per-iteration benchmark curve
                              # is wanted in the paper, and back-filling a skipped
                              # iteration later would need that checkpoint to still
                              # exist on the machine that trained it.
  # SAMPLING = temp .7 / top_p .8 / top_k 20, the setting Qwen3-*-Instruct-2507
  # ships as its own recommendation for NON-thinking use (which is how this base
  # runs, model.chat_template_kwargs.enable_thinking: false). .6/.95 is the
  # THINKING-mode / DeepSeek-R1 setting and is wrong for this model; it is what
  # configs/bench_eval.yaml still carried on 2026-09-01, and the L3 preliminary
  # bench sweep ran under it. The L5 headline sweep must use THESE values, so
  # the canary curve and the final n=32 number stay the same quantity (only `n`
  # differs, and avg@n is unbiased at any n).
  #
  # SET CHOICE: one probe per direction, not two of the same thing. The three
  # AIME sets are near-duplicates of each other and, at n=4 on 30 questions, all
  # too coarse to read (paired SE ~4pp each, ~2.6pp for any two of them pooled).
  # MEASURED on the base at n=32 (runs/bench/Qwen_Qwen3-4B-Instruct-2507_bench_eval_20260901_110721):
  #
  #   set            Q    avg    p=0   p>=.9   paired SE @n=4
  #   hmmt25        30   0.321  33.3%  20.0%       3.35pp
  #   math500_hard 134   0.863   5.2%  76.1%       1.19pp
  #   (aime24/25/26 30   .61/.48/.50               ~4.0pp each)
  #
  #  * hmmt25 — the hardest set and the most cliff-like (a third of its
  #    questions are 0/32 for the base), so this is where transfer OUT of the
  #    training distribution would show up first.
  #  * math500_hard — the regression alarm. 134 questions make it 3x more
  #    precise than any AIME set at the same n, and 76% of them sit at p>=0.9,
  #    so breakage shows immediately. "Too easy to show improvement" is not a
  #    defect here: showing improvement is the final n=32 sweep's job, and that
  #    sweep covers all five sets anyway.
  #
  # Still read the TREND across iterations, not a single-iteration gap.
  benchmarks:
    - {name: hmmt25, n: 4, temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 16384}
    - {name: math500_hard, n: 4, temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 16384}
