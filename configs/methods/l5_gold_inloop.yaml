# L5 CONTROL: GOLD-IN-LOOP — the same EI loop as the main arm, but the cliff
# rows are the reference solution y* VERBATIM instead of a rescue trajectory.
#
# This is NOT the "Gold SFT / distillation" baseline. That one is offline, has no
# rollout and no cliff detection, and trains on y* for EVERY question — it lives
# in configs/methods/l5_gold_sft.yaml. THIS file is the MATCHED control: the
# solved substrate, the rollout budget, the filters, the trainer and the
# iteration count are identical to l5_staged_dpo_s3.yaml, and the single thing
# that changes is where a cliff question's training row comes from. It answers
# "does the rescue trajectory have to be ON-POLICY, or is any correct solution
# enough?", which the offline arm cannot answer because its whole dataset differs.
#
#   bash scripts/run.sh -c configs/methods/l5_gold_inloop.yaml -b
#
# WHERE IT SITS AMONG THE GOLD ARMS — four different questions, do not conflate:
#   l5_gold_sft.yaml        y* for ALL questions, no rollout, no  offline
#                           loop: the distillation baseline       distillation
#   THIS FILE (gold_text)   y* only on cliffs, inside the loop,   off-policy text,
#                           solved rows unchanged                 matched control
#   l5_lspo.yaml (lora_sft) fits an adapter on y*, trains on the  on-policy text,
#                           policy's own samples from it          gold in weights
#   l5_staged_dpo_s3.yaml   bridges z+ the policy wrote from a    on-policy text,
#                           y*-showing prompt, staged + stage-2 DPO gold in prompt
#
# TWO GATES ARE DELIBERATELY DIFFERENT HERE. Both are the arm's definition, and
# both must be stated in the paper rather than buried:
#
#  * no_external_context is DROPPED. y* rides in external_context (the operator
#    records it, per the learnability contract in improve.py), so the gate would
#    reject 100% of this arm's rows. This arm exists precisely to measure what
#    that gate is protecting against.
#  * correctness is KEPT. MEASURED on this mix: MathVerifier accepts 68.1% of
#    cliff gold solutions (89.6% of the ones carrying \boxed, 52.0% of the rest).
#    Dropping the gate to recover the other 32% would train the model on
#    solutions that never emit a boxed answer, which wrecks format compliance
#    under the math_strict benchmark verifier — i.e. it would HANDICAP this
#    baseline, not help it. Report the 68.1% as this arm's yield.
#
# EPOCHS ARE NOT ITERATIONS. train.init_from: base means every iteration
# retrains from the base model, so epochs do NOT accumulate across iterations —
# what accumulates is the dataset (data.accumulate: true). Setting
# sft.epochs = loop.iterations would therefore not "match" anything; it would
# just give this arm 3x the optimizer steps of every other arm on the same data.
# epochs stays 2 and iterations stays 3, identical to every other L5 arm. The
# arm still moves per iteration (fresh rollouts -> new solved rows, a shrinking
# cliff set -> different gold rows), so the iteration axis is meaningful here.
#
# The improve stage does no generation at all (y* is already text), so
# improve+filters are CPU-only and effectively free in this arm.
#
# 2x2 variant — gold TEXT under the cliff objective instead of today's loss:
#   --override train.sft.cliff.enabled=true --override train.sft.cliff.rho=0.3 \
#   --override train.sft.cliff.guard.enabled=true --override filter.selection.always_score=true

run:
  name: l5_gold_inloop
  output_root: runs
  seed: 17
  wandb:
    project: ei_reasoning
    # null -> whichever account is logged in on THIS machine, so a run logs to
    # its own operator's wandb and nothing can fail on a team membership the
    # machine does not have. Runs therefore live in two places when two people
    # run arms; that is fine, because NOTHING in the analysis reads wandb —
    # every paper number comes from metrics.jsonl / verdicts.jsonl, which
    # scripts/collect_run_artifacts.sh packs. Set a shared team entity here
    # only if both accounts are members (wandb.init raises otherwise and
    # loop.py does not catch it -> the run dies at startup).
    entity: null
    mode: online

model:
  base: Qwen/Qwen3-4B-Instruct-2507
  dtype: bfloat16
  # A NO-OP for this base and pinned deliberately: Qwen3-4B-Instruct-2507 is a
  # non-thinking model whose chat template has no `enable_thinking` variable and
  # no <think> tag, so token ids are byte-identical with or without it (checked).
  # It is load-bearing the moment model.base becomes a HYBRID model (Qwen3-4B,
  # -8B, -14B), where the same flag flips the template into thinking mode — and
  # configs/bench_eval.yaml already sets it, so pinning it here keeps the
  # in-loop benchmark canaries and the standalone headline eval on the same
  # prompt for every base we might swap in.
  chat_template_kwargs: {enable_thinking: false}

engine:
  gpus: null
  tensor_parallel: 1
  gpu_memory_utilization: 0.95   # srun owns these GPUs outright; the
                              # score path still drops to 0.80 below
  max_model_len: 20480        # >= train.max_seq_len
  enable_lora: false          # gold_text fits no adapter and samples nothing
  max_logprobs: 20
  score_gpu_memory_utilization: 0.80
  score_max_num_batched_tokens: 4096

data:
  # IDENTICAL to every other L5 arm. y* rides in meta.gold_solution.
  adapter: local_jsonl
  adapter_args:
    path: data/mixes/openr1_mix6k_qwen3-4b-2507.jsonl
  question_suffix: "\n\nPlease reason step by step, and put your final answer within \\boxed{}."
  eval_holdout: 0
  holdout_path: data/mixes/openr1_mix8k_qwen3-4b-2507_cliff_holdout.jsonl
  accumulate: true

rollout:
  n: 8
  temperature: 1.0
  top_p: 0.95
  max_tokens: 16384

partition:
  verifier: math
  solved_keep_max: 4          # MATCHED to every arm. Do not tune per arm.
  solved_selection: shortest
  cliff_max_correct: 0

anchor:
  policy: none                # y* is not a continuation of a failed prefix, so
                              # the operator emits no anchor regardless
  base_selection: first_failed   # NOT min_mean_nll: with policy=none the pick
                              # only stamps base_sample_idx onto ids, but
                              # min_mean_nll pays a full vLLM score pass over
                              # every failed rollout for it — MEASURED 763s per
                              # iteration on 500 questions, ~3.4h at 8k.

improve:
  operator: gold_text         # <-- THE treatment variable: y* as training TEXT
  rounds: 1
  rl:
    enabled: false

filter:
  # no_external_context removed — see the header. Everything else is the arm-
  # matched gate list from configs/methods/l5_staged_dpo_s3.yaml.
  gates: [correctness, length, dedup]
  max_total_tokens: 18432
  max_per_question: 2         # matched cap, but gold is structurally 1 row per
                              # question while the operator arms average ~1.17
                              # (measured). Under the LEGACY loss this arm runs
                              # (cliff.enabled: false) the dose is per ROW, so
                              # that ~17% gap is real — report rows/question and
                              # rho per arm rather than claiming an exact match.
                              # (The cliff objective's per_question_norm would
                              # equalise it, which is one more reason the
                              # objective-on variant below is the cleaner
                              # single-variable contrast against the main arm.)
  selection:
    method: shortest
    always_score: false       # no cliff guard in this arm -> no C(y) pass needed
    scope: continuation

train:                        # IDENTICAL to l5_rft.yaml (today's loss)
  objective: sft
  init_from: base
  backend: zero2
  max_seq_len: 18432
  sft:
    lr: 1.0e-5
    epochs: 2                 # NOT loop.iterations — see the header
    global_batch_size: 32
    micro_batch_size: 1
    region_weights:
      prompt: 0.0
      anchor: 1.0
      continuation: 1.0
      solution: 1.0
    cliff:
      enabled: false

loop:
  iterations: 3

eval:
  # TRACKING ONLY — the headline is NOT measured here. Per docs/L5_protocol_20260829.md
  # the paper's cliff numbers come from a post-hoc `scripts/cliff_reroll.py
  # --qids-file holdout --n 32` on the FINAL checkpoint (plus one base floor
  # shared by every arm), which is the L3 measurement path and runs at
  # rollout.max_tokens. This in-loop pass exists to draw the per-iteration
  # curve, so it is deliberately cheap: greedy off, k=4.
  greedy_pass1: false
  passk: {k: 4, temperature: 0.7, top_p: 0.95}
  max_tokens: 16384         # match rollout: 14.6% of correct samples
                            # exceed 8192 (measured), and censoring them
                            # penalises whichever arm reasons longest
  benchmark_verifier: math_strict
  # Regression canaries on the trained checkpoint — NOT the paper's benchmark
  # numbers (those come from scripts/eval_bench.sh at n=32 on the final ckpt,
  # docs/L5_protocol_20260829.md §3). Their job is only to show that learning
  # cliffs hard does not break general math.
  #
  # n differs by design: aime24 has 30 questions to math500_hard's 134, so the
  # smaller set buys its precision with more samples. Both run at 16384 —
  # math500_hard used to be capped at 8192 and MEASURED 6.5% -> 8.8% truncation
  # across iterations, which censors exactly the arms that reason longest and
  # drifts as the policy does.
  benchmark_every: 1          # EVERY iteration — the per-iteration benchmark curve
                              # is wanted in the paper, and back-filling a skipped
                              # iteration later would need that checkpoint to still
                              # exist on the machine that trained it.
  # SAMPLING = temp .7 / top_p .8 / top_k 20, the setting Qwen3-*-Instruct-2507
  # ships as its own recommendation for NON-thinking use (which is how this base
  # runs, model.chat_template_kwargs.enable_thinking: false). .6/.95 is the
  # THINKING-mode / DeepSeek-R1 setting and is wrong for this model; it is what
  # configs/bench_eval.yaml still carried on 2026-09-01, and the L3 preliminary
  # bench sweep ran under it. The L5 headline sweep must use THESE values, so
  # the canary curve and the final n=32 number stay the same quantity (only `n`
  # differs, and avg@n is unbiased at any n).
  #
  # SET CHOICE: aime25 + hmmt25, the two sets this base is WEAKEST on (avg@64
  # 0.480 / 0.305 measured) — aime24 (0.620) and math500_hard (0.854) leave too
  # little headroom to show movement. The cost is precision: 30 questions x 4
  # samples is a coarse canary (paired SE ~4pp per set, ~2.8pp pooled over the
  # 60), so read the TREND across iterations, never a single-iteration gap.
  # math500_hard was also the most precise regression detector here (134
  # questions); its job now falls to the final n=32 sweep alone.
  benchmarks:
    - {name: aime25, n: 4, temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 16384}
    - {name: hmmt25, n: 4, temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 16384}
