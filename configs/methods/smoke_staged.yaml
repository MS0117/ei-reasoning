# One-iteration smoke test of the STAGED bridge-SFT path on a tiny model:
# plain bridges (no anchor) -> stage-1 LoRA fit -> rollout (b) -> stage-2 fit
# on the still-unsolved cliffs (full_pool + self-wash min C(y), so the wash
# scoring pass is exercised too) -> final rollout -> C(y) selection. Minutes on
# one GPU; validates plumbing, not quality. Bridges get 4096 tokens —
# Qwen3-0.6B truncated 48/48 bridges at a 1024 cap, leaving zero fit pairs.
#
#   bash scripts/smoke.sh 0 configs/methods/smoke_staged.yaml

run:
  name: smoke_staged
  seed: 17
  wandb:
    mode: disabled

model:
  base: Qwen/Qwen3-0.6B

engine:
  max_model_len: 8192         # bridge prompt (question + y*) + 4096-token bridges
  gpu_memory_utilization: 0.60
  enable_lora: true
  max_loras: 4
  max_lora_rank: 16

data:
  adapter: hf_math
  adapter_args:
    preset: openr1
    include_solution: true
    max_items: 300            # stop scanning after 300 kept rows (smoke fast-path)
    n_questions: 16
    seed: 17
  eval_holdout: 4

rollout:
  n: 4
  max_tokens: 1024

partition:
  cliff_max_correct: 0

anchor:
  policy: none                # staged spec: no anchor

improve:
  operator: staged_bridge_sft
  n: 4
  max_tokens: 4096            # 1024 truncated EVERY bridge on Qwen3-0.6B
                              # (48/48 finish_reason=length -> zero fit pairs)
  lora_sft:
    adapter_scope: pooled
    fit:
      steps: 2
      max_pair_tokens: 6144
      num_processes: null
    bridge:
      n: 4                    # 0.6B needs the extra attempts even with y* shown
      max_keep: 2
    staged:
      rollout_n: 2
      num_stages: 1
      chain_adapter: true
      unsolved_targets: regen_bridge   # exercises bridge regen THROUGH the adapter
      solved_targets: self_wash_min_c  # exercises the wash C(y) scoring pass
      train_scope: full_pool
      stage2_objective: dpo   # exercises the preference path: chosen = the bridge,
                              # rejected = this adapter's own stage-1 failure
      dpo:
        beta: 0.1
        sft_weight: 0.5       # also exercises the RPO NLL term
        negative_selection: random
        reference: init
      stage2_steps: 2
      final_rollout_n: 4
      final_rollout_scope: unsolved
      emit: all

filter:
  max_total_tokens: 6144
  selection:
    method: c_score           # exercises the S_mean/S_tail scoring pass
    always_score: false     # true -> measure C(y) even when method != c_score
    lambda_tail: 1.0
    gamma_dtail: 0.0
    tail_fraction: 0.1

train:
  objective: sft
  backend: single
  max_seq_len: 8192
  sft:
    epochs: 1
    global_batch_size: 8
    logging_steps: 1
    # Smoke the FULL cliff objective path: stratified sampler + per-question
    # normalized L_C + v1 unlikelihood negatives + displacement guard
    # (selection.method=c_score above provides the guard refs).
    cliff:
      enabled: true
      rho: 0.3
      m_per_batch: 1
      negative:
        mode: v1
        mu: 0.1
        m_per_batch: 1
      guard:
        enabled: true

loop:
  iterations: 1

eval:
  passk:
    k: 4
  max_tokens: 1024
  benchmarks:
    - {name: math500_hard, adapter_args: {max_items: 5}, n: 2, max_tokens: 1024}
