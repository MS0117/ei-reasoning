# L5 BASELINE: Gold SFT / distillation — OFFLINE SFT on the reference solution
# y*, for every train question. No rollout, no cliff detection, no EI loop.
#
# This is the named "OpenR1 SFT" row of the main table. It is the one arm whose
# whole dataset differs from the others, so read it as a REFERENCE row, not as a
# controlled comparison: it shares the question pool, the holdout and the
# trainer, but not the data recipe. The matched control — y* as the cliff row
# INSIDE the same loop, solved substrate held identical — is a separate arm,
# configs/methods/l5_gold_inloop.yaml.
#
# Run (the dataset is built first, by a CPU script; the loop then trains on it):
#   bash scripts/l5_gold_sft.sh [-c CONFIG] [-g GPUS] [-b] [-- --override a.b=c ...]
# or by hand:
#   .venv/bin/python scripts/build_gold_sft.py -c configs/methods/l5_gold_sft.yaml \
#       --override run.name=l5_gold_sft_manual
#   bash scripts/run.sh -c configs/methods/l5_gold_sft.yaml -r l5_gold_sft_manual -b
#
# WHY NO ROLLOUT. Gold SFT does not need to know what the policy can or cannot
# solve — y* is the target for every question either way. Running the sampling
# stages would burn the whole rollout budget to produce information this arm
# never reads. loop.stages below therefore starts at `train`, and
# scripts/build_gold_sft.py writes iter_0/dataset/train_sft.jsonl directly from
# questions/train.jsonl. eval materializes the questions itself, so the holdout
# split is created exactly as in every other arm.
#
# TWO THINGS A REVIEWER WILL ASK, both to be stated in the paper:
#
#  * FORMAT. The builder keeps only gold solutions the math verifier accepts.
#    MEASURED on the cliff subset of this mix: 68.1% accepted (89.6% of the ones
#    carrying \boxed, 52.0% of the rest). Keeping the rest would train the model
#    on solutions that never emit a boxed answer, which wrecks compliance under
#    the math_strict benchmark verifier — i.e. it would HANDICAP this baseline.
#    Report the accepted fraction from dataset/stats.json as the arm's yield.
#    `--no-verify` on the builder turns the screen off for a robustness check.
#  * LENGTH/STYLE. This mix's gold averages 415 response tokens (measured, n=400)
#    and is a terse reference solution, not long CoT. Two epochs of it can pull
#    the model toward short non-CoT answers, so a BENCHMARK DROP here is a
#    plausible and reportable outcome, not a bug. It is the honest reading of
#    what off-policy distillation on this data does at this scale.
#
# EPOCHS. Default 2, matching every other L5 arm, and that IS the right match:
# train.init_from: base means each iteration retrains from the base model and
# discards the previous checkpoint, so a 3-iteration arm's FINAL model has also
# seen exactly 2 passes over its (accumulated) dataset — the 3x2 epochs never
# compound into the deliverable. The alternative reading, matching the 6 epochs
# the looped arms CONSUME, is available by setting `epochs: 6` below (or
# --override train.sft.epochs=6); note that 6 passes over a static ~5k-row set
# risks memorization (L3 precedent: cliff CE fell to 0.005 under heavy cliff
# pressure). Either way, report total optimizer steps and training tokens per
# arm in the compute column — that is the number this question is really about.

run:
  name: l5_gold_sft
  output_root: runs
  seed: 17
  wandb:
    project: ei_reasoning
    mode: online

model:
  base: Qwen/Qwen3-4B-Instruct-2507
  dtype: bfloat16
  # A NO-OP for this base and pinned deliberately: Qwen3-4B-Instruct-2507 is a
  # non-thinking model whose chat template has no `enable_thinking` variable and
  # no <think> tag, so token ids are byte-identical with or without it (checked).
  # It is load-bearing the moment model.base becomes a HYBRID model (Qwen3-4B,
  # -8B, -14B), where the same flag flips the template into thinking mode — and
  # configs/bench_eval.yaml already sets it, so pinning it here keeps the
  # in-loop benchmark canaries and the standalone headline eval on the same
  # prompt for every base we might swap in.
  chat_template_kwargs: {enable_thinking: false}

engine:
  gpus: null
  tensor_parallel: 1
  gpu_memory_utilization: 0.95   # srun owns these GPUs outright; the
                              # score path still drops to 0.80 below
  max_model_len: 20480        # >= train.max_seq_len
  enable_lora: false          # nothing here fits or serves an adapter
  max_logprobs: 20
  score_gpu_memory_utilization: 0.80
  score_max_num_batched_tokens: 4096

data:
  # IDENTICAL to every other L5 arm. y* rides in meta.gold_solution, and it is
  # the training text of this arm rather than a privileged side channel.
  adapter: local_jsonl
  adapter_args:
    path: data/mixes/openr1_mix6k_qwen3-4b-2507.jsonl
  question_suffix: "\n\nPlease reason step by step, and put your final answer within \\boxed{}."
  eval_holdout: 0
  holdout_path: data/mixes/openr1_mix8k_qwen3-4b-2507_cliff_holdout.jsonl
  accumulate: true            # single iteration, so this never merges anything

rollout:
  # Unused (the rollout stage is not in loop.stages) but kept at the shared
  # values so a diff against the other arms shows only what actually differs.
  n: 8
  temperature: 1.0
  top_p: 0.95
  max_tokens: 16384

partition:
  verifier: math              # the builder screens gold with this same verifier
  solved_keep_max: 4
  solved_selection: shortest
  cliff_max_correct: 0

anchor:
  policy: none

train:                        # IDENTICAL to l5_rft.yaml (today's loss)
  objective: sft
  init_from: base
  backend: zero2
  max_seq_len: 18432
  sft:
    lr: 1.0e-5
    epochs: 2                 # 6 = the "total epochs consumed" reading; see header
    global_batch_size: 32
    micro_batch_size: 1
    region_weights:
      prompt: 0.0
      anchor: 1.0
      continuation: 1.0
      solution: 1.0           # gold rows are source="solved" -> this region
    cliff:
      enabled: false          # no cliff bracket in this arm

loop:
  iterations: 1               # offline SFT: iterating would retrain the same data
  # scripts/build_gold_sft.py produces iter_0/dataset/train_sft.jsonl, so every
  # sampling stage is skipped. eval calls ensure_questions itself, which is what
  # materializes questions/{train,holdout}.jsonl for the builder-free path.
  stages: [train, eval, benchmark_eval]

eval:
  # TRACKING ONLY — the headline is NOT measured here. Per docs/L5_protocol_20260829.md
  # the paper's cliff numbers come from a post-hoc `scripts/cliff_reroll.py
  # --qids-file holdout --n 32` on the FINAL checkpoint (plus one base floor
  # shared by every arm), which is the L3 measurement path and runs at
  # rollout.max_tokens. This in-loop pass exists to draw the per-iteration
  # curve, so it is deliberately cheap: greedy off, k=4.
  greedy_pass1: false
  passk: {k: 4, temperature: 0.7, top_p: 0.95}
  max_tokens: 16384         # match rollout: 14.6% of correct samples
                            # exceed 8192 (measured), and censoring them
                            # penalises whichever arm reasons longest
  benchmark_verifier: math_strict
  # Regression canaries on the trained checkpoint — NOT the paper's benchmark
  # numbers (those come from scripts/eval_bench.sh at n=64 on the final ckpt,
  # docs/L5_protocol_20260829.md §3). Their job is only to show that learning
  # cliffs hard does not break general math.
  #
  # n differs by design: aime24 has 30 questions to math500_hard's 134, so the
  # smaller set buys its precision with more samples. Both run at 16384 —
  # math500_hard used to be capped at 8192 and MEASURED 6.5% -> 8.8% truncation
  # across iterations, which censors exactly the arms that reason longest and
  # drifts as the policy does.
  benchmark_every: 2          # every other iteration: a canary needs a trend,
                              # not a reading per step (~25 min saved per arm,
                              # measured 1424-1497s per benchmark_eval)
  benchmarks:
    - {name: aime24, n: 8, temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 16384}
    - {name: math500_hard, n: 4, temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 16384}
