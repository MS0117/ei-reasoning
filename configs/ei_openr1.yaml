# Expert-iteration config: Qwen3-4B-Instruct-2507 on open-r1/OpenR1-Math-220k
# via the hf_math adapter — a seeded random n_questions sample (order-
# independent), not a head-truncation. First run scans all ~94k rows once
# through the metadata filters below + gold parsability (keeping the
# math-verify-verifiable ~2/3), then questions freeze into runs/<name>/questions/.
# Any field can be overridden on the CLI: --override rollout.n=4
# GPU topology is NEVER hardcoded here: engine.gpus null means "use
# CUDA_VISIBLE_DEVICES, else all visible devices".

run:
  name: ei_qwen3_4b_openr1
  output_root: runs
  seed: 17
  wandb:
    project: ei_reasoning
    mode: online              # online | offline | disabled

model:
  base: Qwen/Qwen3-4B-Instruct-2507
  dtype: bfloat16
  system_prompt: null

engine:
  gpus: null                  # e.g. [0, 1, 2]; null -> CUDA_VISIBLE_DEVICES -> all
  tensor_parallel: 1          # >1 groups GPUs per vLLM worker (bigger models)
  gpu_memory_utilization: 0.90
  max_model_len: 12288        # >= train.max_seq_len (logprob scoring needs full sequences)
  score_batch_size: 256
  enable_prefix_caching: true # anchors share the question prefix — big win in improve
  enforce_eager: false

data:
  adapter: hf_math
  adapter_args:
    # Expands to open-r1/OpenR1-Math-220k default split + metadata cleanup
    # (HF_MATH_PRESETS in data.py): MCQ out (17% — gold is a choice letter;
    # letter/value mismatch misgrades, 4-way guessing pollutes pass rates) via
    # question_type, and rows upstream math-verify never graded an R1
    # generation correct against out (multi-part/text/proof golds, the
    # llama-judge-rescued 12%) via correctness_math_verify. ~59k of 94k kept.
    preset: openr1
    n_questions: 2000         # seeded random sample (replaces max_items head-truncation)
    seed: 17
  question_suffix: "\n\nPlease reason step by step, and put your final answer within \\boxed{}."
  eval_holdout: 200
  accumulate: true            # STaR-style: train on the union of all iterations' data

rollout:
  n: 8
  temperature: 1.0
  top_p: 0.95
  max_tokens: 8192
  capture_logprobs: false

partition:
  verifier: math              # math | lean (lean needs the kimina server)
  solved_keep_max: 4
  solved_selection: shortest  # shortest | first | random

# ---- research extension points ------------------------------------------ #

anchor:                       # (I) how much of a failed rollout to keep
  policy: fixed_fraction      # fixed_fraction | none (register more in anchor.py)
  params:
    fraction: 0.3
    min_tokens: 32
    max_tokens: 2048
  base_selection: first_failed  # which failed rollout to anchor on

improve:                      # (II) how to continue from question+anchor
  operator: self_resample     # self_resample | teacher (stub)
  n: 8
  temperature: 1.2            # hotter than rollout: we need diversity to escape the failure
  top_p: 0.98
  max_tokens: 8192
  rounds: 1
  teacher:
    model: null
    gpus: null
    quantization: null

filter:                       # (III) learnability gates, applied in order
  gates: [correctness, no_external_context, length, dedup]
  max_total_tokens: 10240
  max_per_question: 2
  logprob_gate:
    enabled: false            # scores survivors under the current policy (vLLM pass)
    min_mean_logprob: -1.5
    scope: continuation       # continuation | full

train:                        # (IV) objective over the mixed dataset
  objective: sft              # sft | dpo | sft+dpo
  init_from: base             # base (STaR-style, default) | last
  backend: zero2              # single | zero2 | zero3 | fsdp2
  max_seq_len: 10240
  sft:
    lr: 1.0e-5
    epochs: 2
    scheduler: cosine
    warmup_ratio: 0.03
    global_batch_size: 32     # grad_accum derived at runtime from GPU count
    micro_batch_size: 1
    weight_decay: 0.0
    max_grad_norm: 1.0
    bf16: true
    gradient_checkpointing: true
    packing: false            # per-token region weights require packing off
    logging_steps: 5
    region_weights:           # the key methodology knob for part (IV)
      prompt: 0.0
      anchor: 0.0             # 0 = condition on the anchor, don't imitate it
      continuation: 1.0       # operator's continuation on improved trajectories
      solution: 1.0           # full response on natively-solved trajectories
  dpo:
    lr: 5.0e-7
    beta: 0.1
    epochs: 1
    global_batch_size: 16
    micro_batch_size: 1
    loss_type: sigmoid
    max_grad_norm: 1.0
    logging_steps: 5

loop:
  iterations: 4
  stages: [rollout, partition, anchor, improve, filters, build_dataset, train, eval, benchmark_eval]

eval:
  # In-run holdout eval (cheap, every iteration): tracks EI progress on the
  # training distribution. Absolute numbers come from benchmark_eval below.
  greedy_pass1: true
  passk:
    k: 8
    temperature: 0.7
    top_p: 0.95
  max_tokens: 8192

  # ---- benchmark_eval stage: external competition benchmarks ------------- #
  # Grading (math_strict) follows OPSD/literature conventions: strict last-
  # \boxed extraction, pass@n / avg@n / maj@n / format rate. Sampling below is
  # Qwen3 NON-thinking best practice (temp .7 / top_p .8 / top_k 20) to match
  # the 2507 Instruct base; for hybrid-thinking bases use .6 / .95 / 20, raise
  # max_tokens to ~32768, and set model.chat_template_kwargs {enable_thinking: true}.
  # n=8 keeps per-iteration cost sane; paper-grade numbers (n=32) via
  # scripts/eval_bench.sh + configs/bench_eval.yaml on chosen checkpoints.
  benchmark_verifier: math_strict
  benchmark_every: 1            # run every N iterations (skipped iters still write metrics.json)
  benchmarks:
    - {name: aime24, n: 8, temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 16384}
    - {name: aime25, n: 8, temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 16384}
    - {name: aime26, n: 8, temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 16384}
    - {name: hmmt25, n: 8, temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 16384}
    - {name: math500_hard, n: 4, temperature: 0.7, top_p: 0.8, top_k: 20, max_tokens: 8192}
