# One-iteration smoke test: tiny model, 50 questions, single GPU, minutes not
# hours. Validates the full pipeline plumbing, not model quality.
run:
  name: smoke
  seed: 17
  wandb:
    mode: disabled

model:
  base: Qwen/Qwen3-0.6B

engine:
  max_model_len: 4096
  gpu_memory_utilization: 0.60

data:
  adapter_args:
    hf_name: open-thoughts/OpenThoughts-114k
    config: metadata
    split: train
    domain: math
    max_items: 50
  eval_holdout: 10

rollout:
  n: 4
  max_tokens: 1024

anchor:
  params:
    fraction: 0.3
    min_tokens: 8
    max_tokens: 256

improve:
  n: 4
  max_tokens: 1024

filter:
  max_total_tokens: 2048

train:
  objective: sft
  backend: single
  max_seq_len: 2048
  sft:
    epochs: 1
    global_batch_size: 8
    logging_steps: 1

loop:
  iterations: 1

eval:
  passk:
    k: 4
  max_tokens: 1024
  # Exercise the benchmark_eval plumbing too: 5 questions, 2 samples. Qwen3-0.6B
  # is hybrid-thinking, so most answers truncate at 1024 tokens — that's fine,
  # smoke validates the pipeline, not the score.
  benchmarks:
    - {name: math500_hard, adapter_args: {max_items: 5}, n: 2, max_tokens: 1024}
