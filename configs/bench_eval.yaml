# Standalone benchmark evaluation config — currently set up for hybrid-thinking
# Qwen3 (0.6B/4B/8B) in THINKING mode: enable_thinking on, temp .6 / top_p .95 /
# top_k 20 (Qwen best practice), 32k generation room, n=64 so summarize_benchmark
# reports unbiased pass@{1,2,...,64} on the 30-problem competition sets.
#
#   bash scripts/eval_bench.sh Qwen/Qwen3-4B -g 0,1 -b
#   bash scripts/eval_bench.sh runs/ei_qwen3_4b/iter_2/ckpt
#   bash scripts/eval_bench.sh /path/to/lora_adapter_dir        # auto-merged
#
# The model comes from the launcher's --model-path; model.base here is unused.
# For NON-thinking models (e.g. Qwen3-4B-Instruct-2507) switch to temp 0.7 /
# top_p 0.8, max_tokens 16384 and drop chat_template_kwargs.

run:
  name: bench_eval
  wandb:
    project: ei_reasoning
    mode: online                # no API key -> auto-falls back to offline (wandb sync later)

model:
  chat_template_kwargs: {enable_thinking: true}   # hybrid Qwen3 thinking mode

engine:
  gpus: null                    # CUDA_VISIBLE_DEVICES -> all visible
  tensor_parallel: 1
  gpu_memory_utilization: 0.75  # GPUs are shared: size to the free memory at launch
  max_model_len: 12288          # auto-raised per benchmark to fit prompt+max_tokens

eval:
  greedy_pass1: false           # holdout eval not used standalone
  benchmark_verifier: math_strict
  benchmarks:
    - {name: aime24, n: 64, temperature: 0.6, top_p: 0.95, top_k: 20, max_tokens: 32768}
    - {name: aime25, n: 64, temperature: 0.6, top_p: 0.95, top_k: 20, max_tokens: 32768}
    - {name: aime26, n: 64, temperature: 0.6, top_p: 0.95, top_k: 20, max_tokens: 32768}
    - {name: hmmt25, n: 64, temperature: 0.6, top_p: 0.95, top_k: 20, max_tokens: 32768}
    - {name: math500_hard, n: 8, temperature: 0.6, top_p: 0.95, top_k: 20, max_tokens: 8192}
